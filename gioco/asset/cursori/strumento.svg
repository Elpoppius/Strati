<line x1="16" y1="3" x2="16" y2="11"/><line x1="16" y1="21" x2="16" y2="29"/>
<line x1="3" y1="16" x2="11" y2="16"/><line x1="21" y1="16" x2="29" y2="16"/>
</g>
<g stroke="#f4f4f0" stroke-width="2" stroke-linecap="square">
<line x1="16" y1="3" x2="16" y2="11"/><line x1="16" y1="21" x2="16" y2="29"/>
<line x1="3" y1="16" x2="11" y2="16"/><line x1="21" y1="16" x2="29" y2="16"/>
</g>
<rect x="14.5" y="14.5" width="3" height="3" fill="#f4f4f0" stroke="#1b1b1b" stroke-width="1"/>
</svg>
